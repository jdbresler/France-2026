<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="parisSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A3A5E"/>
      <stop offset="45%" stop-color="#8B6B7A"/>
      <stop offset="100%" stop-color="#E8B968"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="600" fill="url(#parisSky)"/>
  <circle cx="960" cy="180" r="55" fill="#F6DFA8" opacity="0.5"/>

  <!-- distant rooftop skyline -->
  <g fill="#2B2438" opacity="0.55">
    <rect x="0" y="380" width="60" height="70"/>
    <rect x="60" y="360" width="50" height="90"/>
    <rect x="110" y="390" width="70" height="60"/>
    <polygon points="180,390 220,360 260,390"/>
    <rect x="180" y="390" width="80" height="60"/>
    <rect x="260" y="370" width="55" height="80"/>
    <rect x="850" y="380" width="60" height="70"/>
    <rect x="910" y="360" width="60" height="90"/>
    <polygon points="970,380 1010,350 1050,380"/>
    <rect x="970" y="380" width="80" height="70"/>
    <rect x="1050" y="365" width="70" height="85"/>
    <rect x="1120" y="385" width="80" height="65"/>
  </g>

  <!-- Eiffel Tower, centered, simplified -->
  <g fill="#241E30">
    <path d="M600 450 L 560 450 L 585 300 L 578 300 L 597 190 L 592 190 L 600 130 L 608 190 L 603 190 L 622 300 L 615 300 L 640 450 Z"/>
    <path d="M572 340 L 628 340 L 624 320 L 576 320 Z"/>
    <path d="M580 250 L 620 250 L 618 235 L 582 235 Z"/>
    <line x1="560" y1="450" x2="640" y2="450" stroke="#241E30" stroke-width="4"/>
  </g>

  <!-- Notre-Dame-ish twin spires, left of tower -->
  <g fill="#2B2438" opacity="0.85">
    <rect x="360" y="380" width="26" height="70"/>
    <rect x="400" y="380" width="26" height="70"/>
    <rect x="352" y="440" width="82" height="12"/>
  </g>

  <!-- Sacré-Cœur-ish domes, right of tower -->
  <g fill="#2B2438" opacity="0.85">
    <circle cx="760" cy="400" r="22"/>
    <circle cx="800" cy="410" r="15"/>
    <circle cx="730" cy="415" r="13"/>
    <rect x="710" y="420" width="110" height="30"/>
  </g>

  <!-- Seine reflection band -->
  <rect x="0" y="450" width="1200" height="150" fill="#1E1926" opacity="0.55"/>
  <g stroke="#E8B968" stroke-width="1.5" opacity="0.25">
    <line x1="0" y1="470" x2="1200" y2="470"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="530" x2="1200" y2="530"/>
  </g>
</svg>
