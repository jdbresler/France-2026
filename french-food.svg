<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="foodBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8A863"/>
      <stop offset="100%" stop-color="#B87F42"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C7482F"/>
      <stop offset="100%" stop-color="#A6392A"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="600" fill="url(#foodBg)"/>
  <rect x="0" y="380" width="1200" height="220" fill="url(#cloth)" opacity="0.9"/>
  <g stroke="#F2ECDD" stroke-width="3" opacity="0.35">
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- baguette -->
  <g transform="translate(120,300) rotate(-8)">
    <rect x="0" y="0" width="340" height="58" rx="29" fill="#D9A44E"/>
    <rect x="0" y="0" width="340" height="58" rx="29" fill="#E8B968" opacity="0.5"/>
    <g stroke="#8A5A22" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="40" y1="10" x2="55" y2="48"/>
      <line x1="90" y1="8" x2="105" y2="50"/>
      <line x1="140" y1="10" x2="155" y2="48"/>
      <line x1="190" y1="8" x2="205" y2="50"/>
      <line x1="240" y1="10" x2="255" y2="48"/>
      <line x1="290" y1="8" x2="300" y2="46"/>
    </g>
  </g>

  <!-- wine glass -->
  <g transform="translate(560,240)">
    <ellipse cx="0" cy="0" rx="52" ry="30" fill="#6E2E2E"/>
    <path d="M-52 0 C -52 55, 52 55, 52 0 Z" fill="#7E3931"/>
    <rect x="-6" y="45" width="12" height="90" fill="#E5DCC6" opacity="0.85"/>
    <ellipse cx="0" cy="140" rx="46" ry="10" fill="#E5DCC6" opacity="0.85"/>
  </g>

  <!-- cheese wedge -->
  <g transform="translate(760,270)">
    <path d="M0 90 L 70 -30 L 150 90 Z" fill="#EFC96B"/>
    <circle cx="55" cy="55" r="5" fill="#D9A83E"/>
    <circle cx="90" cy="35" r="4" fill="#D9A83E"/>
    <circle cx="70" cy="70" r="4" fill="#D9A83E"/>
  </g>

  <!-- croissant -->
  <g transform="translate(950,290)">
    <path d="M0 40 C 20 -20, 90 -20, 110 40 C 90 20, 60 15, 55 40 C 50 15, 20 20, 0 40 Z" fill="#E8B968"/>
    <path d="M0 40 C 20 -20, 90 -20, 110 40" fill="none" stroke="#B87F30" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- grapes -->
  <g transform="translate(320,340)" fill="#6E5A96">
    <circle cx="0" cy="0" r="14"/>
    <circle cx="16" cy="8" r="14"/>
    <circle cx="-16" cy="8" r="14"/>
    <circle cx="8" cy="24" r="14"/>
    <circle cx="-8" cy="24" r="14"/>
    <circle cx="0" cy="40" r="14"/>
  </g>
</svg>
